name: Uygulamayi derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paketleri kur
        run: npm install
      - name: Uygulamayi derle
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Windows dosyasini yukle
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-exe
          path: dist/*.exe
          if-no-files-found: error
      - name: Mac dosyasini yukle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Mac-uygulamasi
          path: dist/*.zip
          if-no-files-found: error
